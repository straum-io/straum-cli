name: ci

# While the repository holds no Go code, the steps are skipped and the job
# passes. The `core` job (drift, coverage and e2e checks against straum main)
# went with the code; it is under the tag archive/main-2026-10-23.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: hashFiles('**/*.go') != ''
        with:
          go-version-file: go.mod
      - run: make check
        if: hashFiles('**/*.go') != ''
      - name: Coverage (statements, not gated)
        if: hashFiles('**/*.go') != ''
        run: make cover | tee -a "$GITHUB_STEP_SUMMARY"
